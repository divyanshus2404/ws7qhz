services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # snapshot (default, committed Jan 2026 data) or live (fetch from Elexon on startup)
      DATA_SOURCE: ${DATA_SOURCE:-snapshot}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
